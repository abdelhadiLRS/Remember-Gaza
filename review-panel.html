<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; font-src 'self' https: data:;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراجعة واعتماد المساهمات (Secure Moderation Panel)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: white; }
        .glass-card { background: rgba(18, 18, 18, 0.85); border: 1px solid rgba(239, 68, 68, 0.2); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-3xl space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black text-red-500">لوحة مراجعة واعتماد المساهمات</h1>
            <p class="text-gray-400 text-xs sm:text-sm">نظام الأمان المطور والمحمي للمشرفين والمسؤولين</p>
        </header>

        <!-- نافذة تسجيل الدخول عند عدم وود جلسة مصدقة -->
        <div id="login-section" class="glass-card p-6 sm:p-8 rounded-2xl max-w-md mx-auto space-y-4">
            <h2 class="text-lg font-bold text-center text-red-400">تسجيل الدخول الآمن</h2>
            <div class="space-y-3 text-xs text-right">
                <div>
                    <label class="text-gray-300 block mb-1">اسم المستخدم:</label>
                    <input type="text" id="admin-user" placeholder="admin" class="w-full bg-black/60 border border-white/20 text-white px-3 py-2 rounded-xl text-center outline-none focus:border-red-500 font-mono">
                </div>
                <div>
                    <label class="text-gray-300 block mb-1">رمز الدخول السرّي:</label>
                    <input type="password" id="admin-pass" placeholder="••••••••" class="w-full bg-black/60 border border-white/20 text-white px-3 py-2 rounded-xl text-center outline-none focus:border-red-500 font-mono">
                </div>
                <div id="login-error" class="text-red-500 text-center font-bold hidden"></div>
                <button onclick="handlePanelLogin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl transition-all text-xs shadow-[0_0_15px_rgba(220,38,38,0.3)]">دخول الجلسة الآمنة</button>
            </div>
        </div>

        <!-- قسم عرض المساهمات المعتمدة وقيد المراجعة -->
        <div id="dashboard-section" class="space-y-4 hidden">
            <div class="flex justify-between items-center glass-card p-4 rounded-xl text-xs">
                <div>
                    <span class="text-gray-400">المستخدم الحقيقي:</span>
                    <strong id="logged-user-role" class="text-red-400 font-bold ml-1">Administrator</strong>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.location.href='index.html'" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10">العودة للموقع</button>
                    <button onclick="handlePanelLogout()" class="px-3 py-1.5 rounded-lg bg-red-600/20 border border-red-500/40 text-red-400 hover:bg-red-600 hover:text-white font-bold">تسجيل الخروج</button>
                </div>
            </div>

            <div id="panel-submissions-container" class="space-y-3">
                <div class="text-center text-gray-400 py-8">جاري جلب المساهمات بطلب خادمي آمن...</div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/backend-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.BackendAPI && window.BackendAPI.isAuthenticated()) {
                showDashboard();
            }
        });

        async function handlePanelLogin() {
            const u = document.getElementById('admin-user').value.trim();
            const p = document.getElementById('admin-pass').value.trim();
            const err = document.getElementById('login-error');

            err.classList.add('hidden');
            const res = await window.BackendAPI.login(u, p);
            if (res.success) {
                showDashboard();
            } else {
                err.innerText = res.message || 'بيانات الدخول غير صحيحة';
                err.classList.remove('hidden');
            }
        }

        function handlePanelLogout() {
            window.BackendAPI.logout();
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }

        async function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logged-user-role').innerText = window.BackendAPI.getUserRole();
            loadPanelSubmissions();
        }

        async function loadPanelSubmissions() {
            const container = document.getElementById('panel-submissions-container');
            const list = await window.BackendAPI.getSubmissions('ALL');

            if (list.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 text-center text-gray-500 text-xs">لا توجد مساهمات مسجلة حالياً.</div>`;
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="glass-card p-4 rounded-xl space-y-2 text-xs text-right">
                    <div class="flex justify-between items-center">
                        <strong class="text-base text-white">${window.Utils.escapeHTML(item.martyrName || 'اسم غير محدد')}</strong>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            item.status === 'APPROVED' ? 'bg-green-950 text-green-400 border border-green-600/30' :
                            item.status === 'REJECTED' ? 'bg-red-950 text-red-400 border border-red-600/30' :
                            'bg-amber-950 text-amber-400 border border-amber-600/30'
                        }">${item.status || 'PENDING'}</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-gray-300">
                        <p><strong>المدينة:</strong> ${window.Utils.escapeHTML(item.city || '-')}</p>
                        <p><strong>مقدم المساهمة:</strong> ${window.Utils.escapeHTML(item.submitterName || '-')}</p>
                    </div>
                    <p class="text-gray-300 bg-black/40 p-2.5 rounded-lg border border-white/5 leading-relaxed">${window.Utils.escapeHTML(item.notes || '')}</p>
                    ${item.photoUrl ? `<p class="text-blue-400 underline"><a href="${window.Utils.sanitizeUrl(item.photoUrl)}" target="_blank">رابط المرفق / الصورة المستلمة</a></p>` : ''}
                    <div class="flex gap-2 pt-2 border-t border-white/5">
                        <button onclick="updatePanelItem('${item.id}', 'APPROVED')" class="flex-1 bg-green-600/20 border border-green-500/40 text-green-400 py-1.5 rounded-lg font-bold hover:bg-green-600 hover:text-white transition-all">اعتماد وإضافة للأرشيف ✅</button>
                        <button onclick="updatePanelItem('${item.id}', 'REJECTED')" class="flex-1 bg-red-600/20 border border-red-500/40 text-red-400 py-1.5 rounded-lg font-bold hover:bg-red-600 hover:text-white transition-all">رفض ❌</button>
                    </div>
                </div>
            `).join('');
        }

        async function updatePanelItem(id, status) {
            const res = await window.BackendAPI.updateSubmissionStatus(id, status);
            if (res.success) {
                loadPanelSubmissions();
            } else {
                alert(res.message || 'تعذر التحديث');
            }
        }
    </script>
</body>
</html>
