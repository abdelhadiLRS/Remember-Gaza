<style>
*{box-sizing:border-box;}
body{margin:0;background-color:#0a0a0a;overflow:hidden;font-family:'Cairo',sans-serif;color:white;transition: background 0.3s ease, color 0.3s ease;}

/* تنسيق رؤية الأيقونات في الوضع الليلي والمضيء */
.btn-main img, #music-icon-img, .social-links img, .share-btn img, #donate-desktop img { filter: brightness(0) invert(1); transition: filter 0.3s ease; }
body.light-mode .btn-main img, body.light-mode #music-icon-img, body.light-mode .social-links img, body.light-mode .share-btn img, body.light-mode #donate-desktop img { filter: brightness(0) invert(0); }

/* تنسيق الوضع المضيء (Light Mode) */
body.light-mode{background-color:#f3f4f6 !important;color:#111827 !important;}
body.light-mode .glass-panel{background:rgba(255, 255, 255, 0.9) !important;border-color:rgba(220, 38, 38, 0.2) !important;color:#111827 !important;box-shadow:0 4px 6px -1px rgba(0, 0, 0, 0.05);}
body.light-mode #header{background:rgba(255, 255, 255, 0.95) !important;border-bottom-color:rgba(0, 0, 0, 0.1) !important;}
body.light-mode #search-input,
body.light-mode #map-search-input,
body.light-mode select{background:rgba(243, 244, 246, 0.9) !important;color:#111827 !important;border-color:rgba(0, 0, 0, 0.2) !important;}
body.light-mode .modal-box,
body.light-mode #milestone-modal-overlay .modal-box,
body.light-mode #martyr-modal-overlay .modal-box{background:#ffffff !important;color:#111827 !important;border-color:rgba(220, 38, 38, 0.3) !important;}
body.light-mode .text-white{color:#111827 !important;}
body.light-mode .text-gray-300,
body.light-mode .text-gray-400{color:#4b5563 !important;}
body.light-mode .bg-black\/60,
body.light-mode .bg-black\/80,
body.light-mode .bg-black\/40{background:rgba(240, 240, 240, 0.9) !important;}
body.light-mode .tlc,
body.light-mode .tlc-intro-box,
body.light-mode .tlc-decade-card,
body.light-mode .tlc-panel{background:#ffffff !important;color:#111827 !important;}
body.light-mode .tlc-title,
body.light-mode .tlc-decade-num{color:#111827 !important;}
body.light-mode .tlc-excerpt,
body.light-mode .tlc-intro-box{color:#374151 !important;}
body.light-mode #visitor-counter-box,
body.light-mode #counter-box{background:rgba(255, 255, 255, 0.95) !important;color:#111827 !important;}
body.light-mode #verse-container{background:rgba(255, 255, 255, 0.95) !important;color:#111827 !important;border-color:#dc2626 !important;}
body.light-mode #verse-text{color:#111827 !important;}
body.light-mode .modern-counter{background:rgba(255, 255, 255, 0.9) !important;color:#111827 !important;border-color:rgba(0, 0, 0, 0.1) !important;}

#canvas-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;transition:opacity 0.4s ease;pointer-events:auto;cursor:pointer;}
#shooting-stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;}
#stats-view, #videos-view, #no-data-view, #map-view, #milestones-view, #westbank-view, #martyrs48-view{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;background:rgba(10,10,10,0.98);overflow-y:auto;pointer-events:auto;padding-top:90px;padding-bottom:100px;}
body.light-mode #stats-view,
body.light-mode #videos-view,
body.light-mode #no-data-view,
body.light-mode #map-view,
body.light-mode #milestones-view,
body.light-mode #westbank-view,
body.light-mode #martyrs48-view{background:rgba(243, 244, 246, 0.98) !important;}

#ui-layer{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;}
.interactive{pointer-events:auto;}
.glass-panel{background:rgba(15, 15, 15, 0.9);border:1px solid rgba(239,68,68,0.15);backdrop-filter:blur(10px);}
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(10,10,10,0.8);}
::-webkit-scrollbar-thumb{background:#dc2626;border-radius:4px;}

/* هيدر مصغر ومضغوط */
#header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;flex-wrap:nowrap;gap:6px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(10,10,10,0.95);}
#search-input{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:white;padding:4px 10px;border-radius:20px;width:130px;font-size:0.75rem;outline:none;transition:0.4s;}
#search-input:focus{border-color:#ef4444;background:rgba(0,0,0,0.9);box-shadow:0 0 8px rgba(239,68,68,0.3);width:160px;}

.btn-main{background:rgba(255,255,255,0.05);color:white;border:1px solid rgba(255,255,255,0.1);padding:3px 8px;border-radius:20px;cursor:pointer;transition:all 0.3s ease;font-size:0.68rem;white-space:nowrap;}
body.light-mode .btn-main{background:rgba(0,0,0,0.05);color:#111827;border-color:rgba(0,0,0,0.1);}
.btn-main:hover{background:rgba(220,38,38,0.3);border-color:rgba(239,68,68,0.5);}
.btn-main.active{background:#dc2626;border-color:#ef4444;font-weight:bold;box-shadow:0 0 10px rgba(239,68,68,0.4);color:white !important;}

#bottom-bar{display:flex;justify-content:space-between;align-items:flex-end;padding:15px 25px;pointer-events:none;flex-wrap:wrap;gap:15px;}
.social-links a,.share-btn{color:#fff;background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:20px;font-size:0.7rem;text-decoration:none;transition:0.3s;white-space:nowrap;border:1px solid rgba(255,255,255,0.1);cursor:pointer;}
body.light-mode .social-links a, body.light-mode .share-btn{color:#111827;background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.1);}
.social-links a:hover{background:#dc2626;border-color:#ef4444;color:white !important;}
.share-btn:hover{background:#000000;border-color:#ffffff;color:white !important;}
.font-amiri{font-family:'Amiri',serif;}

#visitor-counter-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    height: 26px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    transition: all 0.2s ease;
}
#visitor-counter-box img {
    height: 12px;
    width: auto;
}

#star-tooltip {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid rgba(239, 68, 68, 0.5);
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    display: none;
    font-size: 0.75rem;
    max-width: 230px;
    font-family: 'Cairo', sans-serif;
}
body.light-mode #star-tooltip{background:rgba(255,255,255,0.95);color:#111827;}

.tlc { position: relative; width: 100%; min-height: 100vh; background: #0a0a0a; color: #fff; font-family: 'Cairo', sans-serif; overflow-x: hidden; }
body.light-mode .tlc{background:#f3f4f6;color:#111827;}
.tlc-intro-box { max-width: 950px; margin: 30px auto 40px auto; padding: 30px; background: rgba(15, 15, 15, 0.95); border: 1px solid rgba(239,68,68,0.25); border-radius: 16px; text-align: justify; line-height: 2.2; font-size: 0.95rem; color: #d1d5db; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
.tlc-main { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px 20px; display: flex; flex-direction: column; gap: 60px; }
.tlc-decade-group { display: flex; flex-direction: column; gap: 30px; border-bottom: 2px dashed rgba(239,68,68,0.2); padding-bottom: 50px; }
.tlc-decade { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; margin: 20px 0; }
.tlc-decade-num { font-size: clamp(5rem, 12vw, 9rem); font-weight: 900; color: #e5e5e5; margin: 0; line-height: 1; letter-spacing: -3px; text-shadow: 0 15px 35px rgba(0,0,0,0.9); }
body.light-mode .tlc-decade-num{color:#374151;}
.tlc-decade-num span { color: #dc2626; }
.tlc-decade-divider { width: 50px; height: 3px; background: #dc2626; margin: 5px auto 15px auto; border-radius: 2px; }
.tlc-decade-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }
.tlc-decade-card { background: rgba(18, 18, 18, 0.9); border: 1px solid rgba(239,68,68,0.15); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
.tlc-decade-card:hover { transform: translateY(-5px); border-color: #ef4444; box-shadow: 0 10px 25px rgba(239,68,68,0.2); }
.tlc-decade-card-img { height: 160px; overflow: hidden; position: relative; background: #111; }
.tlc-decade-card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.tlc-decade-card:hover .tlc-decade-card-img img { transform: scale(1.05); }
.tlc-decade-card-body { padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.tlc-decade-card-year { font-size: 0.7rem; color: #ef4444; font-weight: bold; }
.tlc-decade-card-title { font-size: 0.85rem; font-weight: bold; color: #fff; text-align: center; }
body.light-mode .tlc-decade-card-title{color:#111827;}
.tlc-scene { position: relative; border-radius: 20px; overflow: hidden; min-height: 450px; display: flex; align-items: flex-end; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid rgba(239,68,68,0.2); margin-top: 20px; }
.tlc-bg { position: absolute; inset: 0; z-index: 1; }
.tlc-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }
.tlc-bg-tint { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,10,0.95) 20%, rgba(10,10,10,0.5) 70%, rgba(10,10,10,0.3) 100%); }
body.light-mode .tlc-bg-tint{background: linear-gradient(to top, rgba(255,255,255,0.95) 20%, rgba(255,255,255,0.5) 70%, rgba(255,255,255,0.3) 100%);}
.tlc-panel { position: relative; z-index: 2; max-width: 700px; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(239,68,68,0.2); padding: 30px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; }
.tlc-date { background: #dc2626; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; width: max-content; }
.tlc-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin: 0; }
body.light-mode .tlc-title{color:#111827;}
.tlc-alt { font-size: 0.9rem; color: #f87171; margin: 0; font-weight: 600; }
.tlc-excerpt { font-size: 0.9rem; color: #d1d5db; line-height: 1.8; margin: 0; }
body.light-mode .tlc-excerpt{color:#374151;}
.tlc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; flex-wrap: wrap; gap: 15px; }
.tlc-stat { display: flex; flex-direction: column; }
.tlc-stat-label { font-size: 0.75rem; color: #9ca3af; }
.tlc-stat-num { font-size: 1.1rem; font-weight: 900; color: #fca5a5; }
.tlc-more { background: #ef4444; color: #0a0a0a; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.tlc-more:hover { background: #dc2626; color: #fff; }

.tlc-modal-content { display: flex; flex-direction: column; gap: 15px; }
.tlc-modal-title { font-size: 1.5rem; font-weight: 900; color: #f87171; margin: 0; }
.tlc-mdl-alt { font-size: 1rem; color: #d1d5db; font-weight: 600; }
.tlc-modal-meta time { background: #dc2626; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
.tlc-modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(239,68,68,0.3); }
.tlc-modal-desc { font-size: 0.9rem; color: #e5e5e5; line-height: 1.8; }
body.light-mode .tlc-modal-desc{color:#111827;}
.tlc-modal-stat { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
body.light-mode .tlc-modal-stat{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.1);}
.tlc-mdl-stat-label { font-size: 0.75rem; color: #9ca3af; }
.tlc-mdl-stat-num { font-size: 1.1rem; font-weight: 900; color: #fca5a5; }
.tlc-mdl-stat-exp { font-size: 0.8rem; color: #d1d5db; margin: 0; }
body.light-mode .tlc-mdl-stat-exp{color:#4b5563;}
.tlc-modal-source { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: #9ca3af; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
.tlc-modal-source a { color: #f87171; text-decoration: underline; }

@media (max-width: 768px) {
    .tlc-scene { padding: 20px; min-height: 400px; }
    .tlc-panel { padding: 20px; }
    .tlc-title { font-size: 1.4rem; }
    .tlc-intro-box { padding: 20px; margin: 15px; font-size: 0.85rem; }
}

/* Category 2 Scrollytelling Cinematic Styles */
.tlc-scene {
    opacity: 0.35;
    transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(0.96) translateY(20px);
}
.tlc-scene.active {
    opacity: 1;
    transform: scale(1) translateY(0);
}
.tlc-scene .tlc-bg img {
    transition: transform 2.5s ease-out;
}
.tlc-scene.active .tlc-bg img {
    transform: scale(1.1);
}
</style>
</head>
