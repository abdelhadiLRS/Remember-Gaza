<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أرواح فلسطين | Palestinian Souls</title>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Amiri:ital@1&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #cc0000; --blood-dark: #220000; --border-glass: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; overflow: hidden; font-family: 'Cairo', sans-serif; color: white; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }
        #header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid var(--border-glass); z-index: 20; }
        .tabs-container { display: flex; gap: 3px; background: #111; padding: 4px; border-radius: 25px; border: 1px solid var(--border-glass); }
        .tab-btn { background: transparent; border: none; padding: 6px 12px; border-radius: 20px; color: #aaa; cursor: pointer; font-family: 'Cairo'; }
        .tab-btn.active { background: var(--primary-red); color: white; }
        .lang-dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background: #0a0a0a; border: 1px solid var(--border-glass); border-radius: 10px; z-index: 200; }
        .lang-dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #ccc; padding: 10px; display: block; cursor: pointer; text-align: center; }
        .dropdown-content a:hover { background: var(--primary-red); color: white; }
        #bottom-layer { display: flex; justify-content: space-between; align-items: flex-end; padding: 20px; z-index: 20; pointer-events: none; }
        #counter-container { text-align: center; background: rgba(10, 10, 10, 0.9); padding: 10px; border-radius: 12px; border: 1px solid var(--border-glass); }
        #number { font-size: 2rem; font-weight: 700; color: #fff; }
        #tooltip { position: fixed; background: rgba(255, 255, 255, 0.95); color: black; padding: 15px; border-radius: 15px; display: none; pointer-events: auto; z-index: 100; border: 2px solid #cc0000; text-align: center; }
    </style>
</head>
<body>
<div id="ui-layer">
    <div id="header" class="interactive">
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-gaza" onclick="switchCategory('gaza')">غزة</button>
            <button class="tab-btn" id="tab-press" onclick="switchCategory('press')">الصحفيين</button>
        </div>
        <div class="lang-dropdown">
            <button id="lang-btn">🌐 AR</button>
            <div class="dropdown-content">
                <a onclick="selectLanguage('ar')">العربية</a>
                <a onclick="selectLanguage('en')">English</a>
                <a onclick="selectLanguage('fr')">Français</a>
                <a onclick="selectLanguage('es')">Español</a>
            </div>
        </div>
    </div>
    <div id="bottom-layer">
        <div id="counter-container" class="interactive">
            <div id="number">0</div>
            <div id="label">شهيداً وثّقت أسماؤهم</div>
        </div>
    </div>
</div>
<div id="tooltip" class="interactive"></div>

<script>
    let app, mainContainer, points = [], currentLang = 'ar', gazaSouls = [];
    
    const translations = {
        ar: { unknown_age: "غير محدد", label: "شهيداً وثّقت أسماؤهم", age_lbl: "العمر" },
        en: { unknown_age: "Not specified", label: "Documented Martyrs", age_lbl: "Age" },
        fr: { unknown_age: "Non spécifié", label: "Âmes Martyrisées Documentées", age_lbl: "Âge" },
        es: { unknown_age: "No especificado", label: "Almas Mártires Documentadas", age_lbl: "Edad" }
    };

    async function loadExternalCSV() {
        try {
            const res = await fetch('out_killed-in-gaza.csv');
            const csvText = await res.text();
            const lines = csvText.split('\n');
            const headers = lines[0].toLowerCase().split(',');
            const nameIdx = headers.findIndex(h => h.includes('name'));
            const ageIdx = headers.findIndex(h => h.includes('age') || h.includes('dob'));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                let name = cols[nameIdx] || "غير معروف";
                let ageRaw = cols[ageIdx] ? cols[ageIdx].trim() : "";
                
                // التعديل: إذا كان العمر غير موجود أو غير صالح، نضع "غير محدد" ونستمر في إضافة الشهيد للكل
                let age = (ageRaw === "" || isNaN(parseInt(ageRaw))) ? null : ageRaw;

                gazaSouls.push({ name: name, age: age });
            }
        } catch(e) { console.error("Error", e); }
    }

    async function init() {
        app = new PIXI.Application();
        await app.init({ resizeTo: window, backgroundAlpha: 0 });
        document.body.appendChild(app.canvas);
        mainContainer = new PIXI.Container();
        app.stage.addChild(mainContainer);
        await loadExternalCSV();
        renderWorld();
    }

    function renderWorld() {
        points.forEach(p => p.destroy());
        points = [];
        const t = translations[currentLang];
        
        gazaSouls.forEach(soul => {
            const dot = new PIXI.Graphics().circle(0, 0, 3).fill(0xffffff);
            dot.x = Math.random() * app.screen.width;
            dot.y = Math.random() * app.screen.height;
            dot.eventMode = 'static';
            dot.on('pointerdown', (e) => {
                const tooltip = document.getElementById('tooltip');
                const ageDisplay = soul.age ? soul.age : t.unknown_age;
                tooltip.style.display = 'block';
                tooltip.style.left = e.global.x + 'px';
                tooltip.style.top = e.global.y + 'px';
                tooltip.innerHTML = `<b>${soul.name}</b><br>${t.age_lbl}: ${ageDisplay}`;
            });
            mainContainer.addChild(dot);
            points.push(dot);
        });
        document.getElementById('number').innerText = gazaSouls.length.toLocaleString();
    }

    function selectLanguage(lang) {
        currentLang = lang;
        document.getElementById('label').innerText = translations[lang].label;
        document.getElementById('lang-btn').innerText = `🌐 ${lang.toUpperCase()}`;
        renderWorld();
    }

    init();
</script>
</body>
</html>
