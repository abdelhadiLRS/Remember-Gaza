<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرواح غزة وفلسطين | Palestinian Souls</title>
    
    <!-- مكتبات الرسوميات والصوت المستقرة والمحدثة -->
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Amiri:ital@1&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-red: #cc0000; --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Cairo', sans-serif; color: white; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }

        /* شريط علوي موحد ومصغر لجميع الأزرار */
        #header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 25px; background: linear-gradient(to bottom, rgba(0,0,0,1), transparent); 
            gap: 15px; flex-wrap: wrap;
        }

        #search-input {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 10px 20px; border-radius: 30px; width: 150px;
            outline: none; transition: 0.4s; font-family: 'Cairo'; font-size: 0.85rem;
        }
        #search-input:focus { width: 200px; border-color: var(--primary-red); }

        /* شريط التبديل بين الأقسام (غزة - الصحفيين - الضفة) */
        .tabs-container { display: flex; gap: 5px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: transparent; border: none; padding: 6px 14px; border-radius: 20px; color: #aaa; cursor: pointer; font-size: 0.8rem; font-family: 'Cairo'; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-red); color: white; font-weight: bold; }

        .top-btns { display: flex; gap: 8px; align-items: center; }
        button, .btn-style {
            background: var(--glass); color: white; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px; border-radius: 20px; cursor: pointer; font-family: 'Cairo'; transition: 0.3s;
            font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
        }
        button.active { background: var(--primary-red); border-color: #ff4d4d; }

        #donate-box {
            background: rgba(204, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.4);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0px transparent; }
            50% { box-shadow: 0 0 10px rgba(204, 0, 0, 0.5); }
        }

        /* العداد وقسم المطور والآية */
        #counter-container { position: fixed; bottom: 30px; right: 30px; text-align: right; }
        #number { font-size: 3.5rem; font-weight: 700; line-height: 1; color: #fff; }
        
        #dev-credits { 
            position: fixed; bottom: 35px; left: 30px; text-align: left; 
            max-width: 400px; border-left: 3px solid var(--primary-red); padding-left: 15px;
        }
        .quran-verse { font-family: 'Amiri', serif; font-size: 1rem; color: #ccc; margin-bottom: 5px; }
        
        /* الحسابات الخاصة في الأسفل وسط الشاشة */
        #bottom-center-links {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; align-items: center; justify-content: center;
            z-index: 100; text-align: center; width: auto;
        }
        .dev-tag-style { font-size: 0.85rem; color: #aaa; margin-left: 5px; font-weight: bold; }
        .social-links a { 
            color: #fff; background: var(--glass); text-decoration: none; 
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .social-links a:hover { background: var(--primary-red); border-color: #ff3333; }

        /* بطاقة معلومات الشهيد الفخمة المزينة */
        #tooltip {
            position: fixed; background: rgba(255, 255, 255, 0.95); color: black; padding: 12px;
            border-radius: 12px; display: none; pointer-events: none;
            transform: translate(-50%, -120%); z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); min-width: 180px;
            font-family: 'Cairo', sans-serif; text-align: center;
            border: 2px solid #cc0000;
        }
        .duaa-style { font-family: 'Amiri', serif; font-size: 1.15rem; font-weight: bold; margin-top: 5px; display: block; }
        .male-duaa { color: #1b5e20; }
        .female-duaa { color: #880e4f; }
        .press-tag { color: #0d47a1; font-weight: bold; font-size: 0.85rem; }
        
        #empty-notice { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 1px dashed #555; text-align: center; display: none; z-index: 5; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="header">
        <input type="text" id="search-input" class="interactive" placeholder="بحث عن اسم...">
        
        <div class="tabs-container interactive">
            <button class="tab-btn active" onclick="switchCategory('gaza')">غزة</button>
            <button class="tab-btn" onclick="switchCategory('press')">الصحفيين</button>
            <button class="tab-btn" onclick="switchCategory('westbank')">الضفة الغربية</button>
        </div>

        <div class="top-btns">
            <a href="#" target="_blank" id="donate-box" class="btn-style interactive">❤️ <span id="donate-text">تبرع الآن</span></a>
            <button id="music-btn" class="interactive">🎵 صوت</button>
            <button id="lang-btn" class="interactive">EN</button>
        </div>
    </div>

    <div id="empty-notice">
        <p id="notice-text" style="margin: 0; font-size: 0.95rem; color: #ccc;"></p>
    </div>

    <div id="dev-credits" class="interactive">
        <div class="quran-verse" id="verse">"وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِنْدَ رَبِّهِمْ يُرْزَقُونَ"</div>
        <div class="mourning" id="mourning-text" style="color: #888; font-size: 0.75rem;">إنا لله وإنا إليه راجعون</div>
    </div>

    <div id="bottom-center-links" class="interactive">
        <span class="dev-tag-style">تطوير: عبد الهادي</span>
        <div class="social-links">
            <a href="https://www.facebook.com/abdelhadilrs" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/abdelhadilrs" target="_blank">Instagram</a>
            <a href="https://x.com/larrasabdelhadi" target="_blank">X</a>
        </div>
    </div>

    <div id="counter-container">
        <div id="number">0</div>
        <div id="label" style="opacity: 0.6; font-size: 0.85rem;">شهيداً وثّقت أسماؤهم</div>
    </div>
</div>

<div id="tooltip"></div>

<script>
    let app, mainContainer, points = [], currentLang = 'ar', isPlaying = false;
    let currentCategory = 'gaza', tooltipTimeout = null;

    const baseGazaData = [
        { name_ar: "محمد أحمد حمدان", age: 23, gender: "M" },
        { name_ar: "فاطمة محمود النجار", age: 45, gender: "F" },
        { name_ar: "يوسف علي بكر", age: 7, gender: "M" },
        { name_ar: "أحمد بلال زقوت", age: 19, gender: "M" },
        { name_ar: "سارة حسن المصري", age: 32, gender: "F" },
        { name_ar: "نور الدين العطار", age: 12, gender: "M" },
        { name_ar: "جنى رامي فياض", age: 3, gender: "F" }
    ];

    let gazaSouls = [...baseGazaData];
    let pressSouls = [];
    let westbankSouls = [];

    const sound = new Howl({
        src: ['ambient.mp3'], 
        loop: true, 
        volume: 0.4, 
        html5: false
    });

    async function init() {
        app = new PIXI.Application();
        await app.init({ resizeTo: window, backgroundColor: 0x000000, antialias: false });
        document.body.appendChild(app.canvas);

        mainContainer = new PIXI.Container();
        mainContainer.eventMode = 'static';
        app.stage.addChild(mainContainer);

        await loadExternalFiles();
        renderWorld();
    }

    async function loadExternalFiles() {
        try {
            const resGaza = await fetch('killed-in-gaza.json');
            if (resGaza.ok) {
                const extraData = await resGaza.json();
                extraData.forEach(item => {
                    const exists = gazaSouls.some(b => b.name_ar === item.name_ar || b.name === item.name);
                    if (!exists) {
                        gazaSouls.push({
                            name_ar: item.name_ar || item.name || "غير مدرج",
                            age: item.age !== undefined ? item.age : "غير معروف",
                            gender: item.gender || "M"
                        });
                    }
                });
            }
        } catch(e) { console.log("ملف جيسون غزة غير موجود بعد."); }

        try {
            const resPress = await fetch('press_killed_in_gaza.json');
            if (resPress.ok) {
                const pressData = await resPress.json();
                pressSouls = pressData.map(item => ({
                    name_ar: item.name_ar || item.name || "صحفي غير مدرج",
                    age: item.age || "غير معروف",
                    gender: item.gender || "M",
                    isPress: true
                }));
            }
        } catch(e) { 
            pressSouls = [{ name_ar: "حمزة وائل الدحدوح", age: 27, gender: "M", isPress: true }];
        }
    }

    // فحص ذكي لمنع النقاط من المرور فوق الواجهات العلوية والسفلية والكتابات الكلية
    function isInForbiddenZone(x, y) {
        // حماية المنطقة العلوية بالكامل (أزرار التحكم وخانة البحث) حتى 100 بكسل لأسفل الشاشة
        if (y < 100) return true;
        
        // حماية المنطقة السفلية اليسرى (الآية القرآنية الكريمة)
        if (y > app.screen.height - 120 && x < 420) return true;
        
        // حماية المنطقة السفلية اليمنى (العداد والرقم الإحصائي)
        if (y > app.screen.height - 120 && x > app.screen.width - 250) return true;
        
        // حماية المنطقة السفلية الوسطى (روابط الحسابات والملفات الشخصية)
        const centerX = app.screen.width / 2;
        if (y > app.screen.height - 80 && x > centerX - 180 && x < centerX + 180) return true;

        return false;
    }

    function renderWorld() {
        points.forEach(p => p.destroy());
        points = [];
        mainContainer.removeChildren();

        let currentList = [];
        let totalCount = 75123; 

        if (currentCategory === 'gaza') {
            currentList = gazaSouls;
            document.getElementById('empty-notice').style.display = 'none';
        } else if (currentCategory === 'press') {
            currentList = pressSouls;
            totalCount = Math.max(currentList.length, 175); 
            document.getElementById('empty-notice').style.display = 'none';
        } else if (currentCategory === 'westbank') {
            currentList = westbankSouls;
            totalCount = 0;
            document.getElementById('notice-text').innerText = "جاري توثيق وتحديث أسماء شهداء الضفة الغربية...";
            document.getElementById('empty-notice').style.display = 'block';
        }

        const g = new PIXI.Graphics().circle(0, 0, 3.5).fill({ color: 0xffffff, alpha: 0.8 });
        const tex = app.renderer.generateTexture(g);

        const dotsToRender = currentList.length === 0 ? 0 : Math.min(2500, currentList.length + 150);

        for(let i=0; i < dotsToRender; i++) { 
            if(currentList.length === 0) break;
            
            const dot = new PIXI.Sprite(tex);
            
            let posX, posY, attempts = 0;
            do {
                posX = Math.random() * (app.screen.width - 20) + 10;
                posY = Math.random() * (app.screen.height - 20) + 10;
                attempts++;
            } while (isInForbiddenZone(posX, posY) && attempts < 15);

            dot.x = posX;
            dot.y = posY;
            dot.anchor.set(0.5);
            dot.alpha = Math.random() * 0.4 + 0.2; 
            
            dot.userData = currentList[i % currentList.length];
            
            dot.speedX = (Math.random() - 0.5) * 0.12;
            dot.speedY = (Math.random() - 0.5) * 0.12;

            dot.eventMode = 'static';
            dot.cursor = 'pointer';
            
            dot.on('pointerdown', (e) => { e.stopPropagation(); showTooltip(e, dot); });
            dot.on('pointerover', (e) => showTooltip(e, dot));
            dot.on('pointerout', () => startHideTimer(dot));

            mainContainer.addChild(dot);
            points.push(dot);
        }

        animateCounter(totalCount);
    }

    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, sprite) {
        if (tooltipTimeout) { clearTimeout(tooltipTimeout); tooltipTimeout = null; }

        points.forEach(p => { if(p !== sprite) { p.alpha = 0.3; p.scale.set(1); p.tint = 0xffffff; } });

        const d = sprite.userData;
        tooltip.style.display = 'block';
        tooltip.style.left = event.global.x + 'px';
        tooltip.style.top = event.global.y + 'px';
        
        const name = d.name_ar || "غير مدرج";
        const age = d.age;
        
        let duaaText = "";
        if (d.isPress) {
            duaaText = `<span class="press-tag">شَهيدُ الصَّحافة</span> <br><span class="duaa-style male-duaa">﴿ رَحِمَهُۥٓ ٱللَّهُ ﴾</span>`;
        } else if (d.gender === "F") {
            duaaText = `<span class="duaa-style female-duaa">﴿ رَحِمَهَا ٱللَّهُ ﴾</span>`;
        } else {
            duaaText = `<span class="duaa-style male-duaa">﴿ رَحِمَهُۥٓ ٱللَّهُ ﴾</span>`;
        }

        tooltip.innerHTML = currentLang === 'ar' ? 
            `<b>${name}</b> <br>العمر: ${age} سنة <br>${duaaText}` : 
            `<b>${name}</b> <br>Age: ${age} years <br>${duaaText}`;
        
        sprite.alpha = 1;
        sprite.scale.set(3);
        sprite.tint = 0xff3333; 
    }

    function startHideTimer(sprite) {
        if (tooltipTimeout) clearTimeout(tooltipTimeout);
        
        tooltipTimeout = setTimeout(() => {
            tooltip.style.display = 'none';
            resetSpriteAppearance(sprite);
        }, 2000); 
    }

    function resetSpriteAppearance(sprite) {
        sprite.alpha = 0.4;
        sprite.scale.set(1);
        sprite.tint = 0xffffff;
    }

    window.switchCategory = function(category) {
        currentCategory = category;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderWorld();
    };

    function setupUIEvents() {
        document.getElementById('search-input').oninput = (e) => {
            const val = e.target.value.trim().toLowerCase();
            points.forEach(p => {
                const nameField = p.userData.name_ar || "";
                const match = nameField.toLowerCase().includes(val);
                if(val === "") { p.alpha = 0.4; p.tint = 0xffffff; p.scale.set(1); }
                else { 
                    p.alpha = match ? 1 : 0.03; 
                    p.tint = match ? 0xff0000 : 0xffffff;
                    if (match) p.scale.set(2.5); else p.scale.set(0.7);
                }
            });
        };

        document.getElementById('music-btn').onclick = function() {
            if (Howler.ctx && Howler.ctx.state === 'suspended') Howler.ctx.resume();
            if (!isPlaying) {
                sound.play(); 
                this.classList.add('active');
                this.innerText = "🔇 كتم";
            } else {
                sound.pause(); 
                this.classList.remove('active');
                this.innerText = "🎵 صوت";
            }
            isPlaying = !isPlaying;
        };

        document.getElementById('lang-btn').onclick = function() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            this.innerText = currentLang === 'ar' ? 'EN' : 'AR';
            updateUI();
        };

        app.stage.on('pointerdown', () => {
            tooltip.style.display = 'none';
            points.forEach(p => resetSpriteAppearance(p));
        });

        app.ticker.add(() => {
            for(let i=0; i < points.length; i++) {
                const p = points[i];
                p.x += p.speedX; p.y += p.speedY;
                
                if (p.x < 0) p.x = app.screen.width;
                if (p.x > app.screen.width) p.x = 0;
                if (p.y < 0) p.y = app.screen.height;
                if (p.y > app.screen.height) p.y = 0;

                if (isInForbiddenZone(p.x, p.y)) {
                    p.speedX *= -1;
                    p.speedY *= -1;
                    p.x += p.speedX * 2;
                    p.y += p.speedY * 2;
                }
            }
        });
    }

    function updateUI() {
        const isAr = currentLang === 'ar';
        document.getElementById('search-input').placeholder = isAr ? "بحث عن اسم..." : "Search...";
        document.getElementById('verse').innerText = isAr ? '"وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا بَلْ أَحْيَاءٌ عِنْدَ رَبِّهِمْ يُرْزَقُونَ"' : '"Think not of those who are slain in Allah\'s way as dead. Nay, they live with their Lord"';
        document.getElementById('donate-text').innerText = isAr ? "تبرع الآن" : "Donate";
        document.getElementById('label').innerText = isAr ? "شهيداً وثّقت أسماؤهم" : "Documented Souls Lost";
    }

    function animateCounter(target) {
        let cur = 0;
        const step = Math.ceil(target / 80) || 1;
        document.getElementById('number').innerText = "0";
        const timer = setInterval(() => {
            cur += step;
            if(cur >= target) { cur = target; clearInterval(timer); }
            document.getElementById('number').innerText = cur.toLocaleString();
        }, 15);
    }

    init().then(() => setupUIEvents());
</script>
</body>
</html>
